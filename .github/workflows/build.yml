name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout del progetto
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache di TDLib (output Android)
        id: tdlib-cache
        uses: actions/cache@v4
        with:
          path: tdlib-out
          key: tdlib-${{ runner.os }}-${{ hashFiles('.tdlib-version') }}

      - name: Compila TDLib per Android (Docker)
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          git clone --depth 1 https://github.com/tdlib/td.git
          cd td/example/android
          docker build --output "$GITHUB_WORKSPACE/tdlib-out" .

      - name: Diagnostica layout output TDLib
        run: |
          echo "===== Contenuto di tdlib-out ====="
          find tdlib-out -maxdepth 6 | sort

      - name: Inserisci .so e sorgenti Java nel progetto
        run: |
          set -e
          find tdlib-out -name '*.so' | while read -r so; do
            abi="$(basename "$(dirname "$so")")"
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "$so" "app/src/main/jniLibs/$abi/"
            echo "Copiato $so -> jniLibs/$abi/"
          done
          javadir="$(find tdlib-out -type d -path '*org/drinkless/tdlib' | head -n1)"
          if [ -z "$javadir" ]; then
            echo "ERRORE: sorgenti TDLib (org/drinkless/tdlib) non trovati"; exit 1
          fi
          mkdir -p app/src/main/java/org/drinkless
          cp -r "$javadir" app/src/main/java/org/drinkless/
          echo "Sorgenti Java copiati da $javadir"
          echo "===== jniLibs ====="; find app/src/main/jniLibs | sort

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK (debug)
        run: |
          gradle assembleDebug --stacktrace \
            -PAPI_ID="${{ secrets.API_ID }}" \
            -PAPI_HASH="${{ secrets.API_HASH }}"

      - name: Carica l'APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-firetv-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
