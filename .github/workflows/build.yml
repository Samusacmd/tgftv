name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout del progetto
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache di TDLib (output Android)
        id: tdlib-cache
        uses: actions/cache@v4
        with:
          path: tdlib-out
          key: tdlib-${{ runner.os }}-${{ hashFiles('.tdlib-version') }}

      - name: Compila TDLib per Android (Docker)
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          git clone --depth 1 https://github.com/tdlib/td.git
          cd td/example/android
          docker build --output "$GITHUB_WORKSPACE/tdlib-out" .

      - name: Estrai TDLib e integra nel progetto
        run: |
          set -e
          mkdir -p tdlib-extracted
          unzip -o tdlib-out/tdlib.zip -d tdlib-extracted
          echo "===== Struttura estratta ====="
          find tdlib-extracted -maxdepth 6 | sort

          # Copia le librerie native (.so) preservando la cartella ABI di origine.
          find tdlib-extracted -name '*.so' | while read -r so; do
            abi="$(basename "$(dirname "$so")")"
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "$so" "app/src/main/jniLibs/$abi/"
            echo "Copiato $so -> jniLibs/$abi/"
          done

          # Trova i SORGENTI Java partendo da TdApi.java (evita la cartella Javadoc con gli .html).
          tdapi="$(find tdlib-extracted -path '*org/drinkless/tdlib/TdApi.java' | head -n1)"
          if [ -z "$tdapi" ]; then
            echo "ERRORE: TdApi.java non trovato nello zip"; exit 1
          fi
          srcroot="${tdapi%/org/drinkless/tdlib/TdApi.java}"
          echo "Sorgenti Java trovati in: $srcroot/org"
          mkdir -p app/src/main/java
          cp -r "$srcroot/org" app/src/main/java/
          echo "===== File Java copiati ====="
          find app/src/main/java/org/drinkless -name '*.java'
          echo "===== jniLibs finali ====="; find app/src/main/jniLibs | sort

      - name: DEBUG campi forum di TdApi
        run: |
          f="app/src/main/java/org/drinkless/tdlib/TdApi.java"
          echo "===== occorrenze messageThreadId ====="
          grep -n "messageThreadId" "$f" | head -40 || echo "NESSUN messageThreadId"
          echo "===== classe ForumTopicInfo (campi) ====="
          grep -n -A 25 "public static class ForumTopicInfo extends" "$f" | head -35 || true
          echo "===== classe ForumTopic (campi) ====="
          grep -n -A 18 "public static class ForumTopic extends" "$f" | head -25 || true

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK (debug)
        run: |
          gradle assembleDebug --stacktrace \
            -PAPI_ID="${{ secrets.API_ID }}" \
            -PAPI_HASH="${{ secrets.API_HASH }}"

      - name: Carica l'APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-firetv-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
