name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout del progetto
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache di TDLib (output Android)
        id: tdlib-cache
        uses: actions/cache@v4
        with:
          path: tdlib-out
          key: tdlib-${{ runner.os }}-${{ hashFiles('.tdlib-version') }}

      - name: Compila TDLib per Android (Docker)
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          git clone --depth 1 https://github.com/tdlib/td.git
          cd td/example/android
          docker build --output "$GITHUB_WORKSPACE/tdlib-out" .

      - name: Estrai TDLib e integra nel progetto
        run: |
          set -e
          mkdir -p tdlib-extracted
          unzip -o tdlib-out/tdlib.zip -d tdlib-extracted
          echo "===== Struttura estratta ====="
          find tdlib-extracted -maxdepth 6 | sort

          # Copia le librerie native (.so) preservando la cartella ABI di origine.
          find tdlib-extracted -name '*.so' | while read -r so; do
            abi="$(basename "$(dirname "$so")")"
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "$so" "app/src/main/jniLibs/$abi/"
            echo "Copiato $so -> jniLibs/$abi/"
          done

          # Trova i SORGENTI Java partendo da TdApi.java (evita la cartella Javadoc con gli .html).
          tdapi="$(find tdlib-extracted -path '*org/drinkless/tdlib/TdApi.java' | head -n1)"
          if [ -z "$tdapi" ]; then
            echo "ERRORE: TdApi.java non trovato nello zip"; exit 1
          fi
          srcroot="${tdapi%/org/drinkless/tdlib/TdApi.java}"
          echo "Sorgenti Java trovati in: $srcroot/org"
          mkdir -p app/src/main/java
          cp -r "$srcroot/org" app/src/main/java/
          echo "===== File Java copiati ====="
          find app/src/main/java/org/drinkless -name '*.java'
          echo "===== jniLibs finali ====="; find app/src/main/jniLibs | sort

      - name: DEBUG API bot di TdApi
        run: |
          f="app/src/main/java/org/drinkless/tdlib/TdApi.java"
          echo "== SendMessage ==";            grep -n "public SendMessage(" "$f" || true
          echo "== GetCallbackQueryAnswer =="; grep -n "public GetCallbackQueryAnswer(" "$f" || true
          echo "== CallbackQueryPayloadData =="; grep -n "public CallbackQueryPayloadData(" "$f" || true
          echo "== InputMessageText ==";        grep -n "public InputMessageText(" "$f" || true
          echo "== FormattedText ==";           grep -n "public FormattedText(" "$f" || true
          echo "== InputTextQuote / ReplyTo ==";grep -n "public static class InputMessageReplyTo" "$f" || true
          echo "== ReplyMarkupInlineKeyboard =="; grep -n -A6 "public static class ReplyMarkupInlineKeyboard extends" "$f" | head -10 || true
          echo "== ReplyMarkupShowKeyboard ==";  grep -n -A10 "public static class ReplyMarkupShowKeyboard extends" "$f" | head -14 || true
          echo "== InlineKeyboardButton ==";     grep -n -A8 "public static class InlineKeyboardButton extends" "$f" | head -12 || true
          echo "== InlineKeyboardButtonTypeCallback =="; grep -n -A6 "public static class InlineKeyboardButtonTypeCallback extends" "$f" | head -10 || true
          echo "== InlineKeyboardButtonTypeUrl =="; grep -n -A6 "public static class InlineKeyboardButtonTypeUrl extends" "$f" | head -10 || true
          echo "== KeyboardButton ==";           grep -n -A8 "public static class KeyboardButton extends" "$f" | head -12 || true
          echo "== Message.replyMarkup ==";      grep -n "ReplyMarkup replyMarkup" "$f" | head || true
          echo "== GetUserFullInfo ==";          grep -n "public GetUserFullInfo(" "$f" || true
          echo "== UserFullInfo.botInfo ==";     grep -n "BotInfo botInfo" "$f" | head || true
          echo "== BotInfo commands ==";         grep -n "BotCommand\[\] commands" "$f" | head || true
          echo "== BotCommand ==";               grep -n -A6 "public static class BotCommand extends" "$f" | head -10 || true
          echo "== ChatTypePrivate ==";          grep -n -A6 "public static class ChatTypePrivate extends" "$f" | head -8 || true
          echo "== WebPage class ==";            grep -n -A40 "public static class WebPage extends" "$f" | head -45 || true
          echo "== LinkPreview class ==";         grep -n -A60 "public static class LinkPreview extends" "$f" | head -65 || true
          echo "== LinkPreviewType subclasses =="; grep -n "public static class LinkPreviewType" "$f" || true
          echo "== LinkPreviewTypePhoto ==";       grep -n -A10 "public static class LinkPreviewTypePhoto extends" "$f" | head -12 || true
          echo "== LinkPreviewTypeArticle ==";     grep -n -A10 "public static class LinkPreviewTypeArticle extends" "$f" | head -12 || true
          echo "== MessageText webPage ==";       grep -n -A12 "public static class MessageText extends" "$f" | head -14 || true
          echo "== StickerFormat ==";             grep -n "public static class StickerFormat" "$f" || true
          echo "== GetFile ==";                   grep -n "public GetFile(" "$f" || true
          echo "== LocalFile fields ==";           grep -n -A20 "public static class LocalFile extends" "$f" | head -22 || true
          echo "== File class fields ==";          grep -n -A12 "public static class File extends Object" "$f" | head -14 || true
          echo "== DownloadFile ==";               grep -n "public DownloadFile(" "$f" || true

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK (debug)
        run: |
          gradle assembleDebug --stacktrace \
            -PAPI_ID="${{ secrets.API_ID }}" \
            -PAPI_HASH="${{ secrets.API_HASH }}"

      - name: Rinomina l'APK con nome e versione (FiregramTV-1.0.N.apk)
        run: |
          apk="$(ls app/build/outputs/apk/debug/*.apk | head -n1)"
          out="app/build/outputs/apk/debug/FiregramTV-1.0.${{ github.run_number }}.apk"
          mv "$apk" "$out"
          echo "APK finale: $out"

      - name: Carica l'APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: FiregramTV-1.0.${{ github.run_number }}
          path: app/build/outputs/apk/debug/FiregramTV-*.apk
          if-no-files-found: error
